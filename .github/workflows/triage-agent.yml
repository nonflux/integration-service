name: Triage Agent
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Scan issue with Model Armor
        id: scan
        run: |
          ISSUE_BODY=$(gh issue view ${{ github.event.issue.number }} \
            --json title,body --jq '.title + "\n" + (.body // "")')
          export ISSUE_TEXT="$ISSUE_BODY"
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H "Content-Type: application/json" \
            "https://modelarmor.${GCP_LOCATION}.rep.googleapis.com/v1/projects/${GCP_PROJECT_ID}/locations/${GCP_LOCATION}/templates/${MODEL_ARMOR_TEMPLATE}:sanitizeUserPrompt" \
            -d "$(jq -n '{user_prompt_data: {text: env.ISSUE_TEXT}}')")
          echo "$RESPONSE" | jq .
          MATCH=$(echo "$RESPONSE" | jq -r '.sanitizationResult.filterMatchState // "UNKNOWN"')
          echo "match=$MATCH" >> "$GITHUB_OUTPUT"
          if [ "$MATCH" = "MATCH_FOUND" ]; then
            echo "::error::Model Armor detected prompt injection or jailbreak"
            echo "detected=true" >> "$GITHUB_OUTPUT"
          elif [ "$MATCH" = "NO_MATCH_FOUND" ]; then
            echo "detected=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Model Armor scan failed or returned unknown state: $MATCH"
            echo "detected=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_LOCATION: ${{ secrets.GCP_LOCATION }}
          MODEL_ARMOR_TEMPLATE: ${{ secrets.MODEL_ARMOR_TEMPLATE }}

      - name: Flag injected issue
        if: steps.scan.outputs.detected == 'true'
        run: |
          MARKER="<!-- fullsend:triage-agent -->"
          NEW_CONTENT="⚠️ **Prompt injection detected.** This issue has been flagged by Google Cloud Model Armor and will not be processed by the agent. A human maintainer will review it."
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -1)
          if [ -n "$COMMENT_ID" ]; then
            OLD_BODY=$(gh api "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" --jq '.body')
            OLD_CONTENT=$(echo "$OLD_BODY" | tail -n +2)
            printf -v BODY '%s\n%s\n\n<details>\n<summary><b>Previous update</b></summary>\n\n%s\n\n</details>' \
              "$MARKER" "$NEW_CONTENT" "$OLD_CONTENT"
            gh api "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -X PATCH -f body="$BODY"
          else
            printf -v BODY '%s\n%s' "$MARKER" "$NEW_CONTENT"
            gh issue comment ${{ github.event.issue.number }} --body "$BODY"
          fi
          gh issue edit ${{ github.event.issue.number }} \
            --add-label "security/prompt-injection"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate agent app token
        if: steps.scan.outputs.detected != 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: Triage issue
        if: steps.scan.outputs.detected != 'true'
        uses: google-github-actions/run-gemini-cli@v0.1.21
        with:
          gemini_api_key: ${{ secrets.AI_API_KEY }}
          gemini_model: gemini-3.1-flash-preview
          settings: |
            {
              "tools": {
                "core": [
                  "read_file",
                  "run_shell_command(gh)",
                  "run_shell_command(echo)"
                ]
              }
            }
          prompt: |
            Read the GEMINI.md file for project context.
            Read the .gemini/commands/triage-issue.md skill for detailed instructions.

            Triage GitHub issue #${{ github.event.issue.number }}.

            Issue title: "${{ github.event.issue.title }}"

            Use `gh issue view ${{ github.event.issue.number }}` to read the full issue body.
            Then follow the triage-issue skill steps to classify and label it.

            IMPORTANT: Follow the "Posting Comments" section in triage-issue.md
            for in-place comment updates using the <!-- fullsend:triage-agent --> marker.
          upload_artifacts: 'true'
          github_issue_number: '${{ github.event.issue.number }}'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

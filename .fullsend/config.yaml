# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference
version: "1"
roles:
    - triage
    - coder
    - review
    - fix
    - retro
    - prioritize
agents:
    - name: review
      source: https://raw.githubusercontent.com/fullsend-ai/agents/dbe59e46cfb47455dfefb7ffb1f640b04ba1a478/harness/review.yaml#sha256=f907d479383567c5b33c73ac30bd1ba9e91ccdcc86056476315c489d0af207f9
      ref: steer-recheck
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
create_issues:
    allow_targets:
        repos:
            - nonflux/integration-service
            - fullsend-ai/fullsend
mint_url: https://mint.fullsend.sh
inference:
    project: it-gcp-konflux-dev-fullsend
    wif_provider: projects/855403973659/locations/global/workloadIdentityPools/fullsend-inference/providers/gh-nonflux-integration-service

---
version: 1
# TEMPORARY: agents v0.39.0 policies/base.yaml plus a read-only allowlist for
# GitHub Packages (npm.pkg.github.com and its tarball redirect host), node only.
# Probe for fullsend-ai/fullsend#6649. Remove after the probe.
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  github_packages_probe:
    name: github-packages-probe
    endpoints:
      - host: npm.pkg.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        allow_encoded_slash: true
        rules:
          - allow: { method: GET, path: /** }
      - host: pkg-npm.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: /** }
    binaries:
      - path: "**/node"
